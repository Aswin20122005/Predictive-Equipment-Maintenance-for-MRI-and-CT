name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          flake8 backend tests
          black --check backend tests
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mediwatch:ci .
      - name: Run and smoke-test
        run: |
          docker run -d --name app -p 8000:8000 mediwatch:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/api/health && break; sleep 2; done
          curl -fs http://localhost:8000/ | grep -qi '<div id="app"'
          curl -fs http://localhost:8000/api/dashboard | grep -q MRI_01
          curl -fs -X POST http://localhost:8000/api/agent/run/MRI_01 | grep -q ticket_id
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/risk/NOPE)" = 404
      - name: Logs on failure
        if: failure()
        run: docker logs app
